version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: medora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medora
      POSTGRES_PASSWORD: medora_password
      POSTGRES_DB: medora
    ports:
      - "5432:5432"
    volumes:
      - medora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medora -d medora"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medora-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://medora:medora_password@postgres:5432/medora
      SECRET_KEY: ${SECRET_KEY:-medora-docker-dev-secret-key-change-in-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FRONTEND_URL: http://localhost:5173
      BACKEND_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medora-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:5173"

volumes:
  medora_pgdata:
